[package]
name = "sezgi-bench"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sezgi-core = { path = "../core" }
# float_roundtrip: journal resume requires bit-exact f64 parse (default parser is best-effort, up to 1 ULP off)
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
sezgi-problems = { path = "../problems" }
sezgi-components = { path = "../components" }
thiserror = "2"
rayon = "1"

[dev-dependencies]
tempfile = "3"
