# Firefly Algorithm (Yang, X.-S. 2010) -- the built-in `firefly` preset
# (crates/components/src/presets.rs::firefly), run through
# `sezgi.run_experiment` / `sz_run_experiment`.
#
# Component decomposition (see crates/components/src/fa.rs's module doc
# for the pinned attractiveness formula, the floored `betamin` variant, the
# closed-form `alpha` decay, and the verified hybrid live/frozen loop
# semantics):
#   - init:      init/uniform          -- uniform-random fireflies
#   - generator: gen/fa                -- population sorted by fitness
#                                          first (REQUIRED for the verified
#                                          in-place semantics), then the
#                                          O(n^2*dim) double loop: distance
#                                          and a firefly's own accumulating
#                                          term read the LIVE array, the
#                                          additive move target reads a
#                                          FROZEN start-of-generation
#                                          snapshot; `dim` fresh draws per
#                                          firing `(i,j)` pair only
#   - boundary:  boundary/clamp        -- clamps a moved-out-of-bounds coord
#   - replacer:  replace/generational  -- fireflies overwritten
#                                          unconditionally (fa_ndim.m's own
#                                          loop has no greedy comparison)
#   - adapter:   none
#
# `pop_size = 25` is the number of fireflies (this wave's convention; the
# source's own demo uses 20).
#
# What this preset gives you that examples/python/fa.py + examples/r/fa.R
# do NOT: a bit-identical, semver-pinned RNG-stream contract (the
# conditional, per-firing-pair draw count is itself part of the pin), IOH-
# profiler logging via `log_dir=`, and reproducibility across the whole
# sezgi statistics pipeline. The pure scripts teach the SAME floored
# attractiveness formula and the SAME live/frozen double-loop quirk with
# nothing but a stdlib RNG -- useful for understanding the algorithm, not
# for reproducible experiments.

name = "fa-example"
seeds = [42]
budgets = [2000]

[[algorithms]]
name = "fa"
preset = { kind = "firefly", pop_size = 25 }

[[problems]]
suite = "bbob"
fid = 1
dim = 5
instances = [1]
