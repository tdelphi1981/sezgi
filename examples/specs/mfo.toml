# Moth-Flame Optimization (Mirjalili 2015) -- the built-in `mfo` preset
# (crates/components/src/presets.rs::mfo), run through
# `sezgi.run_experiment` / `sz_run_experiment`.
#
# Component decomposition (see crates/components/src/mfo.rs's module doc
# for the pinned update rule, the verified two-index (own-flame vs
# target-flame) formula, and the blackboard flame-memory design):
#   - init:      init/uniform                -- uniform-random moths
#   - generator: gen/mfo                     -- the pinned distance/spiral
#                                                move (own row `i` unclamped
#                                                for distance, target row
#                                                `min(i, flame_count-1)`
#                                                clamped), 1 draw (`t`) per
#                                                (moth, dimension)
#   - boundary:  boundary/clamp              -- clamps a moved-out-of-bounds
#                                                coord
#   - replacer:  replace/generational        -- moths overwritten
#                                                unconditionally (the
#                                                flames, not the moth
#                                                population, carry elitism)
#   - adapter:   adapter/mfo-flame-update    -- owns the `mfo/flames` +
#                                                `mfo/flame_fitness`
#                                                blackboard state: merges
#                                                this generation's moths
#                                                against the previous
#                                                flames, sorts, truncates
#
# `pop_size = 30` is the number of search agents (also the flame archive
# size); canonical per the source paper.
#
# What this preset gives you that examples/python/mfo.py + examples/r/
# mfo.R do NOT: a bit-identical, semver-pinned RNG-stream contract, the
# flame memory owned as real Rust blackboard state instead of a plain
# script-local variable, IOH-profiler logging via `log_dir=`, and
# reproducibility across the whole sezgi statistics pipeline. The pure
# scripts teach the SAME equations and the SAME merge-sort-truncate flame
# mechanism with nothing but a stdlib RNG -- useful for understanding the
# algorithm, not for reproducible experiments.

name = "mfo-example"
seeds = [42]
budgets = [2000]

[[algorithms]]
name = "mfo"
preset = { kind = "mfo", pop_size = 30 }

[[problems]]
suite = "bbob"
fid = 1
dim = 5
instances = [1]
