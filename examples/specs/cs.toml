# Cuckoo Search (Yang, X.-S. & Deb, S. 2009) -- the built-in
# `cuckoo_search` preset (crates/components/src/presets.rs::cuckoo_search),
# run through `sezgi.run_experiment` / `sz_run_experiment`.
#
# Component decomposition (see crates/components/src/cs.rs's module doc for
# the pinned update rule and RNG-stream contract this preset enforces):
#   - init:      init/uniform                    -- uniform-random nests
#   - generator: gen/cuckoo_levy                  -- one Levy(alpha=1.5)
#                                                     flight step per (nest,
#                                                     dimension) toward the
#                                                     current best
#   - boundary:  boundary/clamp                   -- clamps a Levy-stepped-
#                                                     out-of-bounds coord
#   - replacer:  replace/one-to-one-greedy        -- offspring i replaces
#                                                     parent i iff strictly
#                                                     better (a deliberate
#                                                     sezgi simplification --
#                                                     the paper compares
#                                                     against a RANDOM nest,
#                                                     not the same index; see
#                                                     cs.rs's module doc)
#   - adapter:   adapter/abandon-worst-fraction   -- worst pa=0.25 fraction
#                                                     re-randomized and
#                                                     re-evaluated AFTER
#                                                     replacement each
#                                                     iteration
#
# `pop_size = 25` is the nest count (canonical per the source paper).
#
# What this preset gives you that examples/python/cs.py + examples/r/cs.R do
# NOT: a bit-identical, semver-pinned RNG-stream contract (the Levy sampler's
# draw count is itself data-dependent, but the SAMPLE-CALL boundary is
# pinned), IOH-profiler logging via `log_dir=`, and reproducibility across
# the whole sezgi statistics pipeline. The pure scripts teach the SAME
# equations (including the SAME sezgi simplification for replacement) with
# nothing but a stdlib RNG and `math.gamma`/base-R `gamma()` in place of the
# Rust component's own Lanczos gamma approximation.

name = "cs-example"
seeds = [42]
budgets = [2000]

[[algorithms]]
name = "cs"
preset = { kind = "cuckoo_search", pop_size = 25 }

[[problems]]
suite = "bbob"
fid = 1
dim = 5
instances = [1]
