[build-system]
requires = ["maturin>=1.7"]
build-backend = "maturin"

[project]
name = "sezgi"
version = "0.1.0"
description = "Rust çekirdekli, bileşen-tabanlı meta-sezgisel optimizasyon"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[tool.maturin]
python-source = "python"
module-name = "sezgi._sezgi"
