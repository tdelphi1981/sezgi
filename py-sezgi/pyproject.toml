[build-system]
requires = ["maturin>=1.7"]
build-backend = "maturin"

[project]
name = "sezgi"
version = "0.1.1"
description = "Rust-core, component-based metaheuristic optimization library"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]
authors = [
  { name = "Tolga Berber", email = "tolga.berber@fen.ktu.edu.tr" },
  { name = "Beyzanur Siyah" },
  { name = "Emir Karayağız" },
]
keywords = [
  "metaheuristics",
  "optimization",
  "evolutionary-algorithms",
  "benchmarking",
  "reproducibility",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://tdelphi1981.github.io/sezgi/"
Documentation = "https://tdelphi1981.github.io/sezgi/"
Repository = "https://github.com/tdelphi1981/sezgi"
Issues = "https://github.com/tdelphi1981/sezgi/issues"

[tool.maturin]
python-source = "python"
module-name = "sezgi._sezgi"

# Docs dependency group. Pinned exactly -- never a range (MkDocs 2.0 is an
# announced breaking release). `markdown-exec`/`pymdown-extensions` are
# pulled in NOW (not just what building the current docs needs) so later
# work (executed tutorials, snippet includes, admonitions) reuses this
# same group instead of re-pinning. Installed with
# `uv pip install --python py-sezgi/.venv/bin/python` rather than
# `uv sync --group docs`, so the docs deps land in the SAME venv that
# already carries the maturin-built `sezgi` extension without uv's project
# sync machinery attempting to reinstall/rebuild the project itself -- see
# task-5-report.md for the full rationale.
[dependency-groups]
docs = [
  "mkdocs==1.6.1",
  "mkdocs-material==9.7.7",
  "mkdocstrings==1.0.6",
  "mkdocstrings-python==2.0.8",
  "markdown-exec==1.12.3",
  "pymdown-extensions==11.0.2",
  "matplotlib==3.11.1",
  "mkdocs-jupyter==0.26.3",
  "nbclient==0.11.0",
  "nbformat==5.11.1",
  "ipykernel==7.3.0",
  "jupyter_client==8.10.0",
]
